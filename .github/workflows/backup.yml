name: Backup

on:
  schedule:
    - cron: "0 18 * * *" # 02:00 Malaysia time
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PGMAJOR: "17" # must match the Neon project's PostgreSQL major version
      AWS_DEFAULT_REGION: auto
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
    steps:
      - name: Install pg_dump matching Neon
        run: |
          sudo install -d /usr/share/keyrings
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/pgdg.gpg
          echo "deb [signed-by=/usr/share/keyrings/pgdg.gpg] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq "postgresql-client-${PGMAJOR}"

      - name: Dump and encrypt database
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          umask 077
          DATE=$(date -u +%Y-%m-%d)
          echo "DATE=$DATE" >> "$GITHUB_ENV"
          "/usr/lib/postgresql/${PGMAJOR}/bin/pg_dump" --format=custom --no-owner --dbname="$BACKUP_DATABASE_URL" --file="$RUNNER_TEMP/db.dump"
          # Symmetric, CFB-mode (no AEAD/OCB), so any gpg 2.x can decrypt it.
          gpg --symmetric --cipher-algo AES256 --compliance=openpgp --batch --yes --pinentry-mode loopback \
            --passphrase-fd 3 --output "$RUNNER_TEMP/$DATE.dump.gpg" "$RUNNER_TEMP/db.dump" 3<<<"$BACKUP_PASSPHRASE"
          rm -f "$RUNNER_TEMP/db.dump"
          test -s "$RUNNER_TEMP/$DATE.dump.gpg"

      - name: Upload encrypted dump (backup token, write to clienthub-backups only)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_BACKUP_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_BACKUP_SECRET_ACCESS_KEY }}
        run: |
          aws s3 cp "$RUNNER_TEMP/$DATE.dump.gpg" "s3://clienthub-backups/db/$DATE.dump.gpg" --endpoint-url "$R2_ENDPOINT"

      - name: Verify the uploaded backup decrypts and lists
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_BACKUP_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_BACKUP_SECRET_ACCESS_KEY }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          umask 077
          aws s3 cp "s3://clienthub-backups/db/$DATE.dump.gpg" "$RUNNER_TEMP/verify.dump.gpg" --endpoint-url "$R2_ENDPOINT" --only-show-errors
          gpg --decrypt --batch --yes --pinentry-mode loopback --passphrase-fd 3 \
            --output "$RUNNER_TEMP/verify.dump" "$RUNNER_TEMP/verify.dump.gpg" 3<<<"$BACKUP_PASSPHRASE"
          "/usr/lib/postgresql/${PGMAJOR}/bin/pg_restore" --list "$RUNNER_TEMP/verify.dump" > "$RUNNER_TEMP/verify.list"
          grep -q "TABLE DATA" "$RUNNER_TEMP/verify.list"
          rm -f "$RUNNER_TEMP/verify.dump" "$RUNNER_TEMP/verify.dump.gpg" "$RUNNER_TEMP/verify.list"

      - name: Download files bucket (read-only token)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_FILES_READ_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_FILES_READ_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/files"
          aws s3 sync s3://clienthub-files "$RUNNER_TEMP/files" --endpoint-url "$R2_ENDPOINT" --only-show-errors

      - name: Mirror files to backup bucket (backup token)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_BACKUP_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_BACKUP_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          aws s3 sync "$RUNNER_TEMP/files" s3://clienthub-backups/files/ --endpoint-url "$R2_ENDPOINT" --only-show-errors
