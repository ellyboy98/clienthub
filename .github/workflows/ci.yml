name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: clienthub
          POSTGRES_USER: clienthub
          POSTGRES_PASSWORD: clienthub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clienthub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ConnectionStrings__Default: Host=localhost;Port=5432;Database=clienthub;Username=clienthub;Password=clienthub
      TEST_DB_HOST: localhost
      S3_ENDPOINT: http://localhost:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: clienthub-test
      S3_ACCESS_KEY_ID: clienthub
      S3_SECRET_ACCESS_KEY: clienthub-dev-secret
    steps:
      - uses: actions/checkout@v4

      - name: Start SeaweedFS (S3) and create the test bucket
        run: |
          docker run -d --name storage -p 9000:9000 \
            -e AWS_ACCESS_KEY_ID=clienthub -e AWS_SECRET_ACCESS_KEY=clienthub-dev-secret \
            chrislusf/seaweedfs:4.48 server -dir=/data -master.volumeSizeLimitMB=256 -s3 -s3.port=9000
          for i in $(seq 1 60); do
            curl -sf http://localhost:9000/healthz && break
            sleep 1
          done
          docker run --rm --network host \
            -e AWS_ACCESS_KEY_ID=clienthub -e AWS_SECRET_ACCESS_KEY=clienthub-dev-secret -e AWS_DEFAULT_REGION=us-east-1 \
            amazon/aws-cli --endpoint-url http://localhost:9000 s3api create-bucket --bucket clienthub-test

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore -c Release
      - name: Test
        run: dotnet test --no-build -c Release

  docker-image:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Dockerfile.vercel
        run: docker build -f Dockerfile.vercel -t clienthub .
